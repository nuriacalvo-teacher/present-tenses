# Consulta (sin sintetizar nada) que voces ofrece Gemini y si hay britanicas.
# Imprime la respuesta tal cual en el log. Necesita el secreto GEMINI_API_KEY.

name: Consultar las voces de Gemini

on:
  workflow_dispatch:
  push:
    branches: [claude/video-present-lab]
    paths:
      - '.github/workflows/voces-gemini.yml'

jobs:
  voces:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Consultar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then echo "FALTA EL SECRETO GEMINI_API_KEY"; exit 1; fi
          B=https://generativelanguage.googleapis.com/v1beta/voices
          for q in "" "?language_code=en-GB" "?languageCode=en-GB" "?accent=British" "?accent=british" \
                   "?filter=language_code%3D%22en-GB%22" "?filter=accent%3D%22British%22" "?pageSize=1000"; do
            echo "================ GET /v1beta/voices$q"
            curl -sS -w '\n[HTTP %{http_code}]\n' -H "x-goog-api-key: $GEMINI_API_KEY" "$B$q" | head -c 30000
            echo
          done
